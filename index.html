const KK="da40ng_wb_key_v1";
const $=id=>document.getElementById(id);
try{if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))navigator.serviceWorker.register("sw.js").catch(()=>{});}catch(e){}
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const enc=u=>{let s="";for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s);};
if(location.search.indexOf("lock")>=0){try{localStorage.removeItem(KK);}catch(e){}}
if(!(window.crypto&&crypto.subtle)){$("msg").textContent="This page must be opened via https.";return;}
async function decrypt(key){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.c));return new TextDecoder().decode(pt);}
function show(html){document.open();document.write(html);document.close();}
async function fromStore(){let raw=null;try{raw=localStorage.getItem(KK);}catch(e){}
  if(!raw)return;
  try{const key=await crypto.subtle.importKey("raw",b64(raw),{name:"AES-GCM"},false,["decrypt"]);show(await decrypt(key));}
  catch(e){try{localStorage.removeItem(KK);}catch(_){}}}
$("f").addEventListener("submit",async ev=>{ev.preventDefault();const pw=$("pw").value;if(!pw)return;$("msg").textContent="Checking …";
  try{
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.s),iterations:P.it,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
    let html;try{html=await decrypt(key);}catch(e){$("msg").textContent="Wrong password.";return;}
    if($("rem").checked){try{localStorage.setItem(KK,enc(new Uint8Array(await crypto.subtle.exportKey("raw",key))));}catch(e){}}
    show(html);
  }catch(e){$("msg").textContent="Error: "+e.message;}
});
fromStore();
})();
